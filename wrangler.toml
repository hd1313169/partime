name = "partime-api"
main = "worker/index.ts"
compatibility_date = "2026-04-18"

[env.staging]
name = "partime-api-staging"

[env.staging.vars]
API_PREFIX = "/api"

[[env.staging.d1_databases]]
binding = "DB"
database_name = "partime-db-staging"
database_id = "REPLACE_WITH_STAGING_D1_DATABASE_ID"

[env.production]
name = "partime-api-production"

[env.production.vars]
API_PREFIX = "/api"

[[env.production.d1_databases]]
binding = "DB"
database_name = "partime-db-production"
database_id = "REPLACE_WITH_PRODUCTION_D1_DATABASE_ID"
